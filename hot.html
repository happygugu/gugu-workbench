<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>热点灵感库</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto}
body{
    background: #fff5eb;
    color:#634840;
    padding:24px 16px;
    max-width:740px;
    margin:0 auto;
}
.head-wrap{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:24px;
}
.head-title{
    font-size:26px;
    font-weight:600;
    color:#e89880;
}
.refresh-all{
    padding:10px 22px;
    border:none;
    border-radius:999px;
    background:#f8b8b8;
    color:#fff;
    font-size:15px;
    box-shadow:0 3px 0 #e29292;
    cursor:pointer;
}
.refresh-all:active{
    transform:translateY(2px);
}
.tab-container{
    display:flex;
    gap:12px;
    overflow-x:auto;
    padding-bottom:10px;
    margin-bottom:22px;
}
.tab-container::-webkit-scrollbar{display:none;}
.tab-item{
    flex-shrink:0;
    padding:12px 24px;
    border-radius:999px;
    background:#ffffff;
    border:none;
    font-size:15px;
    cursor:pointer;
    box-shadow:0 3px 0 #f1e2dd;
}
.tab-item.active{
    background:#f8b8b8;
    color:white;
    box-shadow:0 3px 0 #e29292;
}
.board-card{
    background:#ffffff;
    border-radius:28px;
    padding:12px;
    box-shadow:0 6px 0 #f5e9e4;
    height: 70vh;
}
iframe{
    width:100%;
    height:100%;
    border-radius:20px;
    border:0;
}
</style>
</head>
<body>
<div class="head-wrap">
    <h1 class="head-title">热点灵感库</h1>
    <button class="refresh-all" id="refreshBtn">✨全部刷新</button>
</div>

<div class="tab-container" id="tabBox">
    <button class="tab-item active" data-src="https://s.weibo.com/top/summary">微博热搜</button>
    <button class="tab-item" data-src="https://www.bilibili.com/h5/search/hot">B站热搜</button>
    <button class="tab-item" data-src="https://www.zhihu.com/hot">知乎热榜</button>
    <button class="tab-item" data-src="https://www.douyin.com/hot/">抖音热点</button>
</div>

<div class="board-card">
    <iframe id="frame" src="https://s.weibo.com/top/summary"></iframe>
</div>

<script>
const tabBox = document.getElementById("tabBox");
const iframe = document.getElementById("frame");
const refreshBtn = document.getElementById("refreshBtn");

tabBox.addEventListener("click",e=>{
    const tab = e.target.closest(".tab-item");
    if(!tab) return;
    document.querySelectorAll(".tab-item").forEach(t=>t.classList.remove("active"));
    tab.classList.add("active");
    iframe.src = tab.dataset.src;
})
refreshBtn.onclick = ()=>{
    iframe.src = iframe.src;
}
</script>
</body>
</html>
